name: Website health check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public website pages
        run: |
          set -euo pipefail
          for path in / /about.html /products.html /services.html /portfolio.html /careers.html /contact.html /robots.txt /sitemap.xml /assets/og-image.png; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 2 --retry-delay 5 "https://akilisoft.co.tz${path}")"
            if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              echo "Health check failed for ${path}: HTTP ${status}"
              exit 1
            fi
            echo "${path}: HTTP ${status}"
          done
